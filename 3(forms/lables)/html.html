<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Forms</title>
</head>
<body>
   <main>
      <h1>Forms demo</h1>

      <form action="/3(forms)/hello.html">

         <h2>Text</h2>
         <input type="text" placeholder="Enter the text">

         <h2>Password</h2>
         <input type="password" placeholder="Password">

         <h2>Color</h2>
         <input type="color" placeholder="Color">
      </form>

      <br>

      <div>
         <p>
            <label for="cheese">Do you like cheese?</label>
            <input type="checkbox" id="cheese">
         </p>

         <p>
            <label for="milk">Do you like milk</label>
            <input type="checkbox" name="milk" id="milk">
         </p>

         <p>
            <label for="username">Enter a username: </label>
            <input type="text" name="username" id="username" placeholder="Username">
         </p>

         <p>
            <label for="password">Enter a password: </label>
            <input type="password" name="password" id="password" placeholder="Enter the pass">
         </p>

         <h2>Number label:</h2>
         <p>
            <label>
               Enter a number:
               <input type="number" placeholder="+380*********">
            </label>
         </p>
      </div>

      <hr>

      <h2>Search like reddit:</h2>
      <div>


         <form action="https://www.reddit.com/search">
            <label for="q">
               <h3>Enter "dogs":</h3>
               <input type="text" name="q" id="username" placeholder="Dogs in Ukraine">
            </label>
            <br><br>
            <button type="submit">SUBMIT</button>
         </form>

         <hr>

         <h2>Search like google:</h2>
         <form action="https:/www.google.com/search">
            <label for="q">
               <input type="text" name="q" id="q" placeholder="Cats in Australia">
               <button type="submit">SEARCH</button>
            </label>
         </form>
      </div>


     <h2>Checkboxes</h2>
     <div>


      <form action="/birds">
         <label for="like_birds">I agree i like birds</label>
         <input type="checkbox" name="like_birds" id="like_birds" checked value="yes">

         <button type="submit">SUBMIT</button>
      </form>
     </div>

     <h2>Radio buttons</h2>
     <div>
         <form action="/vegetables">
            <label for="banana">Banana</label>
            <input type="radio" name="vegetable" id="banana" value="banana" checked>

            <br>

            <label for="apple">Apple</label>
            <input type="radio" name="vegetable" id="apple" value="apple">

            <br>

            <label for="coconut">Coconut</label>
            <input type="radio" name="vegetable" id="coconut" value="coconut">

            <br>

            <p><button type="submit">SUBMIT</button></p>
         </form>
     </div>

     <h2>Options</h2>
     <div>

      <form action="/languages">
         <label for="language">Select a language:</label>
         <select name="language" id="language">
            <option value="uk">Ukrainian</option>
            <option value="en" selected>English</option>
            <option value="ch">Chinies</option>
         </select>

         <p><button type="submit">SUBMIT</button></p>
      </form>

     </div>

     <h2>Range</h2>
     <div>
         <form action="">

            <label for="volume">Volume level:</label>
            <input type="range" name="volume" id="volume" min="0" max="100" value="20" step="25">

            <button type="submit">SUBMIT</button>
         </form>
     </div>

     <h2>Textarea</h2>
     <div>
      <label for="textarea">Textarea:</label>
      <p><textarea cols="50" rows="10" name="textarea" id="textarea" placeholder="Type smth"></textarea></p>
     </div>

     <h2>Required tag</h2>
     <div>
      <form action="/register">
         <label for="name">Enter your name:</label>
         <input type="text" placeholder="Your name" name="name" id="name" required minlength="2"></input>
<br>
         <label for="password">Enter your password:</label>
         <input type="password" name="password" id="password" required minlength="8" maxlength="15" placeholder="Your password">
<br>
         <button type="submit">SUBMIT</button>
      </form>
     </div>


   </main>
</body>
</html>
