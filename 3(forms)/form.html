<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Form</title>
</head>
<body>
   <main>
      <h1>Race Registration</h1>
      <form action="/register">
         <!-- First/Last Name -->
         <div>
            <label for="name">First Name:</label>
            <input type="text" name="name" id="name" required>

            <label for="last_name">Last Name</label>
            <input type="text" name="last_name" id="last_name" required>
         </div>

         <br>
         <!-- Races -->
         <div>
            <h2>Select a race:</h2>

            <input type="radio" name="race" id="fun" value="fun" checked>
            <label for="fun">fun race</label>
<br>
            <input type="radio" name="race" id="half" value="half">
            <label for="half">half race</label>
<br>
            <input type="radio" name="race" id="full" value="full">
            <label for="full">full race</label>
<br>
         </div>
         <!-- Email and Password -->
         <div>
            <label for="email">Email</label>
            <input type="email" name="email" id="email" placeholder="email" required>

            <label for="password">Password</label>
            <input type="password" name="password" id="password" placeholder="password" required>
         </div>

         <!-- Age -->
         <div>
            <label for="age">Select your age group</label>
            <select name="age" id="age" required>
               <option value="kid">under 18</option>
               <option value="adult">18-40</option>
               <option value="old">40+</option>
            </select>
         </div>

         <button type="submit">Register</button>
      </form>
   </main>
</body>
</html>
